[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caption-tidier"
version = "0.1.0"
description = "Clean caption files in place-safe sidecars: timing, speakers, punctuation, re-flow, SRT/VTT/text conversion, optional local LLM review."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Asdale Dynamics, LLC" }]
keywords = ["subtitles", "captions", "srt", "vtt", "transcription", "ollama", "local-llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Utilities",
]
dependencies = []

[project.scripts]
caption-tidier = "caption_tidier.cli:main"

[tool.setuptools]
packages = ["caption_tidier"]
